name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            archive: WoW-Whisper-macOS-arm64
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            archive: WoW-Whisper-macOS-x64
            arch: x64
          - name: Windows x64
            os: windows-2022
            archive: WoW-Whisper-Windows-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.archive }}
      - name: Check versions and release tooling
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          python scripts/version.py --check
          python -m unittest discover -s scripts/tests
          if [[ "$BUILD_REF" == refs/tags/v* ]]; then
            python scripts/version.py --check --tag "${BUILD_REF#refs/tags/}"
          elif [[ "$BUILD_REF" == v* ]]; then
            python scripts/version.py --check --tag "$BUILD_REF"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "${EXPECTED_ARCH/x64/x86_64}"
          sh scripts/bundle-macos.sh
          codesign --verify --deep --strict "dist/WoW Whisper.app"
          mkdir -p dist/package
          cp -R "dist/WoW Whisper.app" dist/package/
          cp packaging/INSTALL.txt LICENSE THIRD_PARTY_NOTICES.md dist/package/
          mkdir -p dist/package/assets/wow
          cp assets/wow/NOTICE.md dist/package/assets/wow/
          ditto -c -k --sequesterRsrc dist/package "dist/$ARCHIVE.zip"
      - name: Build Windows app
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/package/assets/wow | Out-Null
          Copy-Item target/release/wow-chat.exe dist/package/
          Copy-Item packaging/INSTALL.txt,LICENSE,THIRD_PARTY_NOTICES.md dist/package/
          Copy-Item assets/wow/NOTICE.md dist/package/assets/wow/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:ARCHIVE.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish release
    needs: desktop
    if: inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: WoW-Whisper-*
          path: release-assets
          merge-multiple: true
      - name: Validate, checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          python3 scripts/version.py --check --tag "$tag"
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          (cd release-assets && sha256sum ./*.zip > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --verify-tag --title "WoW Whisper $tag" --notes-file packaging/RELEASE_NOTES.md --generate-notes
          fi
