name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: release-version
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 scripts/version.py --bump "$BUMP"
      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock packaging/Info.plist
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "WoW Whisper $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
  build-and-publish:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      publish: true
